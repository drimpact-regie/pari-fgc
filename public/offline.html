<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Impact'O Bet — Hors ligne</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0e17;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 8px;
      }
      p {
        color: #9aa0ac;
        font-size: 14px;
        max-width: 320px;
        line-height: 1.5;
      }
      .dot {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid #eac35c;
      }
      button {
        margin-top: 20px;
        background: #eac35c;
        color: #0b0e17;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="dot"></div>
      <h1>Pas de connexion</h1>
      <p>
        Impact'O Bet a besoin d'internet pour afficher les paris et les
        résultats en direct. Reconnecte-toi puis réessaie.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
